<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Relationship Cues — Card Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700;800&family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Montserrat:wght@700;800&family=Playfair+Display:wght@700;800&family=Lora:wght@600;700&family=Caveat:wght@600;700&family=Pacifico&family=League+Spartan:wght@600;700;800&family=Archivo+Black&family=Raleway:wght@700;800&family=DM+Sans:wght@700;800&family=Nunito:wght@700;800&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #121212;
    font-family: 'Poppins', -apple-system, Roboto, 'Segoe UI', sans-serif;
    color: #fff;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    height: 100dvh;
    margin: 0 auto;
    padding: 12px;
    padding-bottom: 0;
    overflow: hidden;
  }
  h1 {
    font-size: 15px;
    text-align: center;
    margin: 0 0 8px;
    font-weight: 600;
    color: #eee;
    letter-spacing: 0.5px;
    flex: 0 0 auto;
  }
  .canvas-container {
    position: relative;
    flex: 0 0 auto;
    width: auto;
    height: 42vh;
    max-height: 380px;
    max-width: 100%;
    aspect-ratio: 4 / 5;
    margin: 0 auto;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    touch-action: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  canvas#card {
    width: 100%;
    height: 100%;
    display: block;
  }
  .placeholder-btn {
    position: absolute;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 14px;
    pointer-events: none;
    text-align: center;
    padding: 0 20px;
  }
  .divider {
    position: absolute;
    left: 0; right: 0;
    height: 32px;
    margin-top: -16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: ns-resize;
    z-index: 5;
  }
  .divider .bar {
    width: 50px;
    height: 6px;
    background: #4CAF50;
    border-radius: 3px;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.35);
  }
  .hint {
    font-size: 12px;
    color: #777;
    text-align: center;
    margin-top: 6px;
    flex: 0 0 auto;
  }
  .controls {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 24px;
  }
  .row { display: flex; gap: 10px; }
  button {
    flex: 1;
    background: #2b2b2b;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 13px 10px;
    font-size: 14px;
    font-weight: 600;
  }
  button:active { background: #3a3a3a; }
  button.primary { background: #4CAF50; border-color: #4CAF50; }
  button.primary:active { background: #43a047; }
  textarea {
    width: 100%;
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    text-transform: uppercase;
    resize: none;
    min-height: 70px;
  }
  label.small {
    font-size: 13px;
    color: #aaa;
    display: flex;
    justify-content: space-between;
  }
  input[type=range] { width: 100%; }
  #fileInput { display: none; }

  .swatchRow {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .fontRow {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
    flex-shrink: 0;
  }
  .fontChip {
    flex: 0 0 auto;
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 16px;
    white-space: nowrap;
  }
  .fontChip.selected {
    border-color: #4CAF50;
    background: #23331f;
    box-shadow: 0 0 0 1px #4CAF50;
  }
  .swatch {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid transparent;
    padding: 0;
    flex: 0 0 auto;
    position: relative;
    box-shadow: 0 0 0 1px #3a3a3a;
  }
  .swatch.selected {
    border-color: #4CAF50;
    box-shadow: 0 0 0 1px #4CAF50;
  }
  .toggleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1c1c1c;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    color: #eee;
  }
  .toggleRow input[type=checkbox] {
    width: 20px;
    height: 20px;
    accent-color: #4CAF50;
  }
  button:disabled {
    opacity: 0.4;
  }
  .colorPickBtn {
    flex: 1;
    background: #2b2b2b;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 13px 10px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }
  .colorPickBtn input[type=color] {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 6px;
    padding: 0;
    background: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Relationship Cues — Card Maker</h1>

  <div class="canvas-container" id="canvasContainer">
    <canvas id="card" width="1080" height="1350"></canvas>
    <div class="placeholder-btn" id="placeholderHint">Select an image below</div>
    <div class="divider" id="divider"><div class="bar"></div></div>
  </div>
  <div class="hint">📌 Drag the image to reposition · use "Zoom" to crop tighter</div>

  <div class="controls">
    <div class="toggleRow">
      <span>🔤 Full Text Card (no image)</span>
      <input type="checkbox" id="fullTextToggle" />
    </div>

    <div class="row">
      <button id="pickImageBtn">📷 Select Image</button>
      <button id="saveBtn" class="primary">💾 Save Post</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" />

    <label class="small">Font Style</label>
    <div class="fontRow" id="fontRow"></div>

    <label class="small">Colour Style</label>
    <div class="swatchRow" id="swatchRow"></div>

    <label class="small">🖍️ Tap-Word Colour <span style="font-weight:400;color:#666;">tap any word on the card</span></label>
    <div class="swatchRow" id="tapColorRow"></div>
    <div class="row">
      <label class="colorPickBtn" for="tapColorPicker">🎨 Custom Colour
        <input type="color" id="tapColorPicker" value="#E53935" />
      </label>
      <button id="clearTapColorsBtn">✖️ Clear Word Colours</button>
    </div>

    <div class="row" id="fullTextExtras" style="display:none;">
      <button id="randomGradientBtn">🎨 Random Gradient</button>
      <label class="colorPickBtn" for="bgColorPicker">🖌️ Pick Colour
        <input type="color" id="bgColorPicker" value="#4CAF50" />
      </label>
    </div>

    <textarea id="factText" placeholder="Type your text here..."></textarea>

    <label class="small">Font Size <span id="fontSizeVal">56</span>px
      <input type="range" id="fontSize" min="28" max="150" value="56" />
    </label>

    <label class="small">Image Zoom / Crop <span id="zoomVal">100</span>%
      <input type="range" id="zoom" min="100" max="300" value="100" />
    </label>

    <div class="hint">Saved image goes to your "Downloads" folder</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('card');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('canvasContainer');
  const divider = document.getElementById('divider');
  const placeholderHint = document.getElementById('placeholderHint');
  const factText = document.getElementById('factText');
  const fontSizeInput = document.getElementById('fontSize');
  const fontSizeVal = document.getElementById('fontSizeVal');
  const zoomInput = document.getElementById('zoom');
  const zoomVal = document.getElementById('zoomVal');
  const fileInput = document.getElementById('fileInput');
  const fullTextToggle = document.getElementById('fullTextToggle');
  const pickImageBtn = document.getElementById('pickImageBtn');
  const swatchRow = document.getElementById('swatchRow');
  const fontRow = document.getElementById('fontRow');
  const fullTextExtras = document.getElementById('fullTextExtras');
  const randomGradientBtn = document.getElementById('randomGradientBtn');
  const bgColorPicker = document.getElementById('bgColorPicker');
  const tapColorRow = document.getElementById('tapColorRow');
  const tapColorPicker = document.getElementById('tapColorPicker');
  const clearTapColorsBtn = document.getElementById('clearTapColorsBtn');

  // Canvas is 4:5 (width:height) — TEXT area on TOP, IMAGE area on BOTTOM
  const SIZE_W = 1080;
  const SIZE_H = 1350;
  const WATERMARK_TEXT = 'RELATIONSHIP CUES';

  // Pinterest-style card text ke liye sabse popular aur readable fonts —
  // bold, clean, big-impact fonts jo chhoti screen par bhi clearly padhe jaate hain.
  const FONT_OPTIONS = [
    { id: 'anton',        name: 'Anton',           stack: '"Anton", Arial, sans-serif',            weight: 400 },
    { id: 'bebas',        name: 'Bebas Neue',      stack: '"Bebas Neue", Arial, sans-serif',        weight: 400 },
    { id: 'montserrat',   name: 'Montserrat',      stack: '"Montserrat", Arial, sans-serif',        weight: 800 },
    { id: 'poppins',      name: 'Poppins',         stack: '"Poppins", Arial, sans-serif',           weight: 700 },
    { id: 'oswald',       name: 'Oswald',          stack: '"Oswald", Arial, sans-serif',             weight: 600 },
    { id: 'leaguespartan',name: 'League Spartan',  stack: '"League Spartan", Arial, sans-serif',    weight: 700 },
    { id: 'archivoblack', name: 'Archivo Black',   stack: '"Archivo Black", Arial, sans-serif',     weight: 400 },
    { id: 'raleway',      name: 'Raleway',         stack: '"Raleway", Arial, sans-serif',            weight: 800 },
    { id: 'dmsans',       name: 'DM Sans',         stack: '"DM Sans", Arial, sans-serif',            weight: 700 },
    { id: 'nunito',       name: 'Nunito',          stack: '"Nunito", Arial, sans-serif',             weight: 800 },
    { id: 'playfair',     name: 'Playfair Display',stack: '"Playfair Display", Georgia, serif',      weight: 700 },
    { id: 'lora',         name: 'Lora',            stack: '"Lora", Georgia, serif',                  weight: 600 },
    { id: 'baskerville',  name: 'Libre Baskerville',stack: '"Libre Baskerville", Georgia, serif',    weight: 700 },
    { id: 'caveat',       name: 'Caveat',          stack: '"Caveat", cursive',                       weight: 700 },
    { id: 'pacifico',     name: 'Pacifico',        stack: '"Pacifico", cursive',                     weight: 400 },
  ];

  // Selectable text/background colour combinations. `highlight` is the colour
  // a tapped word turns — chosen per combo so it still stands out.
  const COMBOS = [
    { bg: '#FFFFFF', text: '#000000', highlight: '#E53935', name: 'White' },
    { bg: '#000000', text: '#FFFFFF', highlight: '#FFD54F', name: 'Black' },
    { bg: '#F5D400', text: '#000000', highlight: '#D32F2F', name: 'Yellow' },
    { bg: '#D32F2F', text: '#FFFFFF', highlight: '#FFEB3B', name: 'Red' },
    { bg: '#1B5E20', text: '#FFFFFF', highlight: '#FFD54F', name: 'Green' },
    { bg: '#0D1B4C', text: '#FFFFFF', highlight: '#FFD54F', name: 'Navy' },
    { bg: '#F8BBD0', text: '#000000', highlight: '#AD1457', name: 'Pink' },
    { bg: '#4A148C', text: '#FFFFFF', highlight: '#FFEB3B', name: 'Purple' },
    { bg: '#FB8C00', text: '#000000', highlight: '#FFFFFF', name: 'Orange' },
    { bg: '#00695C', text: '#FFFFFF', highlight: '#FFD54F', name: 'Teal' },
    { bg: '#5D1049', text: '#FFFFFF', highlight: '#FFD54F', name: 'Maroon' },
    { bg: '#C8E6C9', text: '#000000', highlight: '#2E7D32', name: 'Mint' },
    { bg: '#81D4FA', text: '#000000', highlight: '#0D47A1', name: 'Sky Blue' },
    { bg: '#2C2C2C', text: '#FFFFFF', highlight: '#FF7043', name: 'Charcoal' },
  ];

  // Palette of colours the user can pick from before tapping a word on the
  // card — the selected one is what a tapped word turns.
  const TAP_PALETTE = [
    '#E53935', '#FF7043', '#FB8C00', '#F5D400', '#FFD54F',
    '#4CAF50', '#00BFA5', '#00B8D4', '#2196F3', '#3F51B5',
    '#8E24AA', '#D81B60', '#FFFFFF', '#000000',
  ];

  let state = {
    image: null,
    fullText: false, // when true, no image is needed and text fills the whole card
    comboIndex: 0,    // which COMBOS entry is active
    font: FONT_OPTIONS[0], // currently selected text font
    customBg: null,   // { bgColors: [hex] or [hex,hex], text, highlight } — Full Text mode only
    textRatio: 0.32,   // fraction of height given to the TEXT area (top)
    fontSize: 56,
    text: factText.value,
    zoom: 1,          // 1 = fully fit, higher = zoomed in / more cropped
    centerX: null,    // center point of the crop window, in source-image pixels
    centerY: null,
    cropW: null,
    cropH: null,
    tapColor: TAP_PALETTE[0],  // colour that gets applied when a word is tapped
    wordColors: {},   // { wordIdx: hexColor } — per-word colour overrides from tapping
    wordHitboxes: [],  // rebuilt every drawCard(): [{idx, x1, y1, x2, y2}]
    splitY: 0
  };

  // Returns { bgColors: [hex] or [hex,hex], text, highlight }. In Full Text
  // mode a custom (gradient or manually picked) background takes priority.
  function currentCombo() {
    if (state.fullText && state.customBg) return state.customBg;
    const preset = COMBOS[state.comboIndex];
    return { bgColors: [preset.bg], text: preset.text, highlight: preset.highlight };
  }

  function luminance(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  }
  function isLightColor(hex) { return luminance(hex) > 0.6; }
  function avgIsLight(colors) {
    return (colors.reduce((s, c) => s + luminance(c), 0) / colors.length) > 0.6;
  }

  function hexToRgba(hex, alpha) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // Builds a solid or (2-colour) gradient fillStyle from a bgColors array.
  function bgFillStyle(colors, alpha) {
    if (alpha === undefined) alpha = 1;
    if (colors.length === 1) return hexToRgba(colors[0], alpha);
    const grad = ctx.createLinearGradient(0, 0, SIZE_W, SIZE_H);
    grad.addColorStop(0, hexToRgba(colors[0], alpha));
    grad.addColorStop(1, hexToRgba(colors[1], alpha));
    return grad;
  }

  // Auto-picks readable text/highlight colours for a custom background.
  function contrastFor(colors) {
    const dark = !avgIsLight(colors);
    return { text: dark ? '#FFFFFF' : '#000000', highlight: dark ? '#FFD54F' : '#D32F2F' };
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
  }

  // A fresh, reasonably pleasant random 2-colour gradient each time it's called.
  function randomGradientColors() {
    const h1 = Math.floor(Math.random() * 360);
    const h2 = (h1 + 40 + Math.floor(Math.random() * 120)) % 360;
    const s = 65 + Math.floor(Math.random() * 20);
    const l = 42 + Math.floor(Math.random() * 16);
    return [hslToHex(h1, s, l), hslToHex(h2, s, l)];
  }

  function buildFontRow() {
    fontRow.innerHTML = '';
    FONT_OPTIONS.forEach((f) => {
      const btn = document.createElement('button');
      btn.className = 'fontChip' + (f.id === state.font.id ? ' selected' : '');
      btn.style.fontFamily = f.stack;
      btn.style.fontWeight = f.weight;
      btn.textContent = f.name;
      btn.addEventListener('click', () => {
        state.font = f;
        buildFontRow();
        drawCard();
      });
      fontRow.appendChild(btn);
    });
  }
  buildFontRow();

  function buildSwatches() {
    swatchRow.innerHTML = '';
    COMBOS.forEach((combo, i) => {
      const btn = document.createElement('button');
      const usingCustom = state.fullText && state.customBg;
      btn.className = 'swatch' + (!usingCustom && i === state.comboIndex ? ' selected' : '');
      btn.style.background = combo.bg;
      btn.title = combo.name;
      btn.addEventListener('click', () => {
        state.comboIndex = i;
        state.customBg = null; // preset overrides any gradient/manual colour
        buildSwatches();
        drawCard();
      });
      swatchRow.appendChild(btn);
    });
  }
  buildSwatches();

  function buildTapColorRow() {
    tapColorRow.innerHTML = '';
    TAP_PALETTE.forEach((color) => {
      const btn = document.createElement('button');
      btn.className = 'swatch' + (color.toLowerCase() === state.tapColor.toLowerCase() ? ' selected' : '');
      btn.style.background = color;
      btn.title = color;
      btn.addEventListener('click', () => {
        state.tapColor = color;
        buildTapColorRow();
      });
      tapColorRow.appendChild(btn);
    });
  }
  buildTapColorRow();

  function layoutLines(wordObjs, maxWidth) {
    const spaceWidth = ctx.measureText(' ').width;
    const lines = [];
    let currentLine = [];
    let currentWidth = 0;
    wordObjs.forEach((w) => {
      const addWidth = currentLine.length ? spaceWidth + w.width : w.width;
      if (currentWidth + addWidth > maxWidth && currentLine.length) {
        lines.push(currentLine);
        currentLine = [w];
        currentWidth = w.width;
      } else {
        currentLine.push(w);
        currentWidth += addWidth;
      }
    });
    if (currentLine.length) lines.push(currentLine);
    return lines;
  }

  // Draws `img` blurred, covering the whole card (used as a Full Text mode
  // background). Drawn slightly oversized so blur edge softening stays off-canvas.
  function drawFullTextBackgroundImage(img, blurPx) {
    const margin = 40;
    const targetW = SIZE_W + margin * 2;
    const targetH = SIZE_H + margin * 2;
    const targetRatio = targetW / targetH;
    const imgRatio = img.width / img.height;
    let baseW, baseH;
    if (imgRatio > targetRatio) { baseH = img.height; baseW = baseH * targetRatio; }
    else { baseW = img.width; baseH = baseW / targetRatio; }
    const cropX = (img.width - baseW) / 2;
    const cropY = (img.height - baseH) / 2;
    ctx.save();
    ctx.filter = `blur(${blurPx}px)`;
    ctx.drawImage(img, cropX, cropY, baseW, baseH, -margin, -margin, targetW, targetH);
    ctx.restore();
  }

  function drawCard() {
    ctx.clearRect(0, 0, SIZE_W, SIZE_H);
    const combo = currentCombo();
    const splitY = state.fullText ? SIZE_H : Math.round(SIZE_H * state.textRatio);
    state.splitY = splitY;

    // ---- BACKGROUND — full canvas in Full Text mode, top area otherwise ----
    if (state.fullText && state.image) {
      // Blurred photo behind the text, tinted with the chosen colour so text stays readable
      drawFullTextBackgroundImage(state.image, 22);
      ctx.fillStyle = bgFillStyle(combo.bgColors, 0.55);
      ctx.fillRect(0, 0, SIZE_W, SIZE_H);
    } else {
      ctx.fillStyle = bgFillStyle(combo.bgColors);
      ctx.fillRect(0, 0, SIZE_W, splitY);
    }

    const paddingX = 60;
    const maxWidth = SIZE_W - paddingX * 2;
    const baseFontStr = `${state.font.weight} ${state.fontSize}px ${state.font.stack}`;
    ctx.font = baseFontStr;
    ctx.textBaseline = 'middle';

    function measureWord(word) {
      return ctx.measureText(word).width;
    }

    const paragraphs = (state.text || '').split(/\n/);
    let globalIdx = 0;
    const lines = [];
    paragraphs.forEach(para => {
      const paraWords = para.toUpperCase().split(/\s+/).filter(Boolean);
      if (paraWords.length === 0) {
        lines.push([]); // preserve an intentional blank line
        return;
      }
      const wordObjs = paraWords.map(word => {
        const idx = globalIdx++;
        return { word, idx, width: measureWord(word) };
      });
      layoutLines(wordObjs, maxWidth).forEach(l => lines.push(l));
    });
    const spaceWidth = ctx.measureText(' ').width;
    // Every line is the same height now — no word changes size anymore.
    const lineHeight = state.fontSize * 1.18;
    const lineHeights = lines.map(() => lineHeight);
    const totalTextHeight = lineHeights.reduce((a, b) => a + b, 0);
    const textAreaCenterY = splitY / 2;
    const lineYs = [];
    let cursorY = textAreaCenterY - totalTextHeight / 2;
    lineHeights.forEach(h => {
      cursorY += h / 2;
      lineYs.push(cursorY);
      cursorY += h / 2;
    });

    ctx.textAlign = 'left';
    state.wordHitboxes = [];
    lines.forEach((lineWords, i) => {
      const lineWidth = lineWords.reduce((sum, w) => sum + w.width, 0) + spaceWidth * (lineWords.length - 1);
      let x = SIZE_W / 2 - lineWidth / 2;
      const y = lineYs[i];
      lineWords.forEach(w => {
        ctx.fillStyle = state.wordColors[w.idx] || combo.text;
        ctx.fillText(w.word, x, y);
        state.wordHitboxes.push({
          idx: w.idx,
          x1: x, y1: y - lineHeight / 2,
          x2: x + w.width, y2: y + lineHeight / 2
        });
        x += w.width + spaceWidth;
      });
    });

    // ---- IMAGE AREA (bottom) — skipped entirely in Full Text mode ----
    if (!state.fullText) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, splitY, SIZE_W, SIZE_H - splitY);

    if (state.image) {
      const img = state.image;
      const targetW = SIZE_W, targetH = SIZE_H - splitY;
      const targetRatio = targetW / targetH;
      const imgRatio = img.width / img.height;

      let baseW, baseH;
      if (imgRatio > targetRatio) { baseH = img.height; baseW = baseH * targetRatio; }
      else { baseW = img.width; baseH = baseW / targetRatio; }

      const cropW = baseW / state.zoom;
      const cropH = baseH / state.zoom;

      state.centerX = Math.max(cropW / 2, Math.min(state.centerX, img.width - cropW / 2));
      state.centerY = Math.max(cropH / 2, Math.min(state.centerY, img.height - cropH / 2));

      const cropX = state.centerX - cropW / 2;
      const cropY = state.centerY - cropH / 2;

      state.cropW = cropW;
      state.cropH = cropH;

      ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, splitY, targetW, targetH);
    }
    } // end image-area (!state.fullText)

    // ---- WATERMARK — colour adapts so it stays readable on any background ----
    // On a photo (normal mode) we always assume it's dark-ish and use light text
    // with a dark scrim. In Full Text mode the "background" is the chosen combo
    // colour, so we pick light/dark watermark styling based on its brightness.
    const wmOnLightBg = state.fullText && avgIsLight(combo.bgColors);
    ctx.save();

    if (!state.fullText) {
      const scrimH = 130;
      const scrimGrad = ctx.createLinearGradient(0, SIZE_H - scrimH, 0, SIZE_H);
      scrimGrad.addColorStop(0, 'rgba(0,0,0,0)');
      scrimGrad.addColorStop(1, 'rgba(0,0,0,0.38)');
      ctx.fillStyle = scrimGrad;
      ctx.fillRect(0, SIZE_H - scrimH, SIZE_W, scrimH);
    }

    const wmLineColor = wmOnLightBg ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.55)';
    const wmTextColor = wmOnLightBg ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.92)';

    // thin center rule above the wordmark
    ctx.strokeStyle = wmLineColor;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(SIZE_W / 2 - 22, SIZE_H - 46);
    ctx.lineTo(SIZE_W / 2 + 22, SIZE_H - 46);
    ctx.stroke();

    ctx.font = `600 20px "Poppins", Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = wmTextColor;
    ctx.letterSpacing = '5px';
    ctx.fillText(WATERMARK_TEXT, SIZE_W / 2 + 2, SIZE_H - 26);
    ctx.restore();

    const displayRatio = container.clientHeight / SIZE_H;
    divider.style.display = state.fullText ? 'none' : 'flex';
    divider.style.top = (splitY * displayRatio) + 'px';
    placeholderHint.style.top = (splitY * displayRatio) + 'px';
    placeholderHint.style.height = ((SIZE_H - splitY) * displayRatio) + 'px';
    placeholderHint.style.display = (state.image || state.fullText) ? 'none' : 'flex';
  }

  // Converts a pointer event's client coords into canvas-pixel coords
  // (the 1080x1350 space drawCard() works in), regardless of on-screen scale.
  function canvasPointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (SIZE_W / rect.width),
      y: (e.clientY - rect.top) * (SIZE_H / rect.height)
    };
  }

  function wordAtCanvasPoint(pt) {
    const pad = 6; // small tolerance so tapping near a word's edge still hits it
    for (const box of state.wordHitboxes) {
      if (pt.x >= box.x1 - pad && pt.x <= box.x2 + pad &&
          pt.y >= box.y1 - pad && pt.y <= box.y2 + pad) {
        return box.idx;
      }
    }
    return null;
  }

  let dragging = false;
  function ratioFromClientY(clientY) {
    const rect = container.getBoundingClientRect();
    let ratio = (clientY - rect.top) / rect.height;
    return Math.max(0.15, Math.min(0.6, ratio));
  }
  divider.addEventListener('pointerdown', (e) => {
    dragging = true;
    divider.setPointerCapture(e.pointerId);
  });
  divider.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    state.textRatio = ratioFromClientY(e.clientY);
    drawCard();
  });
  divider.addEventListener('pointerup', () => { dragging = false; });
  divider.addEventListener('pointercancel', () => { dragging = false; });

  // ---- Move/reposition the image by dragging it (image area is BOTTOM) ----
  // ---- OR tap a word in the text area to recolour it ----
  let imgDragging = false;
  let lastX = 0, lastY = 0;
  let tapCandidate = null; // { startClientX, startClientY, canvasPt }
  const TAP_MOVE_TOLERANCE = 10; // px on screen — beyond this it's a drag, not a tap

  canvas.addEventListener('pointerdown', (e) => {
    const pt = canvasPointFromEvent(e);
    const inImageArea = !state.fullText && state.image && pt.y >= state.splitY;

    if (inImageArea) {
      imgDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    } else {
      tapCandidate = { startClientX: e.clientX, startClientY: e.clientY, canvasPt: pt };
      canvas.setPointerCapture(e.pointerId);
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (imgDragging && state.image) {
      const rect = container.getBoundingClientRect();
      const dxDisplay = e.clientX - lastX;
      const dyDisplay = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      const displayImageHeight = rect.height * (1 - state.textRatio);
      const scaleFactorX = state.cropW / rect.width;
      const scaleFactorY = state.cropH / displayImageHeight;

      state.centerX -= dxDisplay * scaleFactorX;
      state.centerY -= dyDisplay * scaleFactorY;

      drawCard();
    } else if (tapCandidate) {
      const movedX = Math.abs(e.clientX - tapCandidate.startClientX);
      const movedY = Math.abs(e.clientY - tapCandidate.startClientY);
      if (movedX > TAP_MOVE_TOLERANCE || movedY > TAP_MOVE_TOLERANCE) {
        tapCandidate = null; // moved too much — treat as a scroll/drag, not a tap
      }
    }
  });

  canvas.addEventListener('pointerup', (e) => {
    if (tapCandidate) {
      const idx = wordAtCanvasPoint(tapCandidate.canvasPt);
      if (idx !== null) {
        if (state.wordColors[idx] === state.tapColor) {
          delete state.wordColors[idx]; // tapping the same colour again clears it
        } else {
          state.wordColors[idx] = state.tapColor;
        }
        drawCard();
      }
    }
    imgDragging = false;
    tapCandidate = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  });

  canvas.addEventListener('pointercancel', () => {
    imgDragging = false;
    tapCandidate = null;
  });

  pickImageBtn.addEventListener('click', () => {
    fileInput.click();
  });

  fullTextToggle.addEventListener('change', () => {
    state.fullText = fullTextToggle.checked;
    fullTextExtras.style.display = state.fullText ? 'flex' : 'none';
    drawCard();
  });

  randomGradientBtn.addEventListener('click', () => {
    const [c1, c2] = randomGradientColors();
    const contrast = contrastFor([c1, c2]);
    state.customBg = { bgColors: [c1, c2], text: contrast.text, highlight: contrast.highlight };
    buildSwatches();
    drawCard();
  });

  bgColorPicker.addEventListener('input', () => {
    const c = bgColorPicker.value;
    const contrast = contrastFor([c]);
    state.customBg = { bgColors: [c], text: contrast.text, highlight: contrast.highlight };
    buildSwatches();
    drawCard();
  });

  tapColorPicker.addEventListener('input', () => {
    state.tapColor = tapColorPicker.value;
    buildTapColorRow();
  });

  clearTapColorsBtn.addEventListener('click', () => {
    state.wordColors = {};
    drawCard();
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        state.image = img;
        state.zoom = 1;
        state.centerX = img.width / 2;
        state.centerY = img.height / 2;
        zoomInput.value = 100;
        zoomVal.textContent = 100;
        drawCard();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  factText.addEventListener('input', () => {
    state.text = factText.value;
    state.wordColors = {}; // word positions shift with new text, so old taps no longer apply
    drawCard();
  });
  fontSizeInput.addEventListener('input', () => {
    state.fontSize = parseInt(fontSizeInput.value, 10);
    fontSizeVal.textContent = state.fontSize;
    drawCard();
  });
  zoomInput.addEventListener('input', () => {
    state.zoom = parseInt(zoomInput.value, 10) / 100;
    zoomVal.textContent = zoomInput.value;
    drawCard();
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'RelationshipCues_' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  });

  window.addEventListener('resize', drawCard);
  window.addEventListener('load', drawCard);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawCard);
  }
  drawCard();
</script>
</body>
</html>
