<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Relationship Cues — Card Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #121212;
    font-family: 'Poppins', -apple-system, Roboto, 'Segoe UI', sans-serif;
    color: #fff;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    height: 100dvh;
    margin: 0 auto;
    padding: 12px;
    padding-bottom: 0;
    overflow: hidden;
  }
  h1 {
    font-size: 15px;
    text-align: center;
    margin: 0 0 8px;
    font-weight: 600;
    color: #eee;
    letter-spacing: 0.5px;
    flex: 0 0 auto;
  }
  .canvas-container {
    position: relative;
    flex: 0 0 auto;
    width: auto;
    height: 42vh;
    max-height: 380px;
    max-width: 100%;
    aspect-ratio: 4 / 5;
    margin: 0 auto;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    touch-action: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  canvas#card {
    width: 100%;
    height: 100%;
    display: block;
  }
  .placeholder-btn {
    position: absolute;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 14px;
    pointer-events: none;
    text-align: center;
    padding: 0 20px;
  }
  .divider {
    position: absolute;
    left: 0; right: 0;
    height: 32px;
    margin-top: -16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: ns-resize;
    z-index: 5;
  }
  .divider .bar {
    width: 50px;
    height: 6px;
    background: #4CAF50;
    border-radius: 3px;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.35);
  }
  .hint {
    font-size: 12px;
    color: #777;
    text-align: center;
    margin-top: 6px;
    flex: 0 0 auto;
  }
  .dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    flex: 0 0 auto;
  }
  .dots .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #444;
    border: none;
    padding: 0;
    flex: none;
  }
  .dots .dot.active {
    background: #4CAF50;
    width: 20px;
    border-radius: 4px;
  }
  .dots .dotLabel {
    font-size: 12px;
    color: #999;
    margin: 0 4px;
  }
  .controls {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 24px;
  }
  .row { display: flex; gap: 10px; }
  button {
    flex: 1;
    background: #2b2b2b;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 13px 10px;
    font-size: 14px;
    font-weight: 600;
  }
  button:active { background: #3a3a3a; }
  button.primary { background: #4CAF50; border-color: #4CAF50; }
  button.primary:active { background: #43a047; }
  button.colorBtn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .swatchPair {
    display: flex;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.35);
    flex: 0 0 auto;
  }
  .swatchPair span { flex: 1; height: 100%; }
  textarea {
    width: 100%;
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    text-transform: uppercase;
    resize: none;
    min-height: 70px;
  }
  label.small {
    font-size: 13px;
    color: #aaa;
    display: flex;
    justify-content: space-between;
  }
  input[type=range] { width: 100%; }
  #fileInput { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Relationship Cues — Card Maker</h1>

  <div class="canvas-container" id="canvasContainer">
    <canvas id="card" width="1080" height="1350"></canvas>
    <div class="placeholder-btn" id="placeholderHint">Select an image below</div>
    <div class="divider" id="divider"><div class="bar"></div></div>
  </div>
  <div class="dots" id="previewDots">
    <button class="dot active" data-idx="0" aria-label="Preview 1"></button>
    <button class="dot" data-idx="1" aria-label="Preview 2"></button>
    <span class="dotLabel" id="previewLabel">Relationship Cues</span>
  </div>

  <div class="controls">
    <div class="row">
      <button id="pickImageBtn">📷 Select Image</button>
      <button id="saveBtn" class="primary">💾 Save Post</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" />

    <textarea id="factText" placeholder="Type your text here..."></textarea>

    <label class="small">Font Size <span id="fontSizeVal">56</span>px
      <input type="range" id="fontSize" min="28" max="150" value="56" />
    </label>

    <label class="small">Image Zoom / Crop <span id="zoomVal">100</span>%
      <input type="range" id="zoom" min="100" max="300" value="100" />
    </label>

    <div class="hint">Saved image goes to your "Downloads" folder</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('card');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('canvasContainer');
  const divider = document.getElementById('divider');
  const placeholderHint = document.getElementById('placeholderHint');
  const factText = document.getElementById('factText');
  const fontSizeInput = document.getElementById('fontSize');
  const fontSizeVal = document.getElementById('fontSizeVal');
  const zoomInput = document.getElementById('zoom');
  const zoomVal = document.getElementById('zoomVal');
  const fileInput = document.getElementById('fileInput');

  // Canvas is 4:5 (width:height) — TEXT area on TOP, IMAGE area on BOTTOM
  const SIZE_W = 1080;
  const SIZE_H = 1350;
  const FONT_STACK = '"Anton", "Poppins", Arial, sans-serif';
  const WATERMARKS = ['RELATIONSHIP CUES', 'LINK IN COMMENTS'];
  const WATERMARK_LABELS = ['Relationship Cues', 'Link in Comments'];

  // Fixed text/background combination: black text on white background.
  const CARD_BG = '#FFFFFF';
  const CARD_TEXT = '#000000';

  let state = {
    image: null,
    textRatio: 0.32,   // fraction of height given to the TEXT area (top)
    fontSize: 56,
    text: factText.value,
    zoom: 1,          // 1 = fully fit, higher = zoomed in / more cropped
    centerX: null,    // center point of the crop window, in source-image pixels
    centerY: null,
    cropW: null,
    cropH: null,
    redWords: new Set(), // indices (into the current word list) of words tapped red
    wordBoxes: [],        // hit-test boxes for each drawn word, rebuilt every drawCard()
    previewIndex: 0       // which watermark variant is currently shown in the live preview (0 or 1)
  };

  const previewDots = document.getElementById('previewDots');
  const previewLabel = document.getElementById('previewLabel');

  function updatePreviewUI() {
    previewDots.querySelectorAll('.dot').forEach(d => {
      d.classList.toggle('active', parseInt(d.dataset.idx, 10) === state.previewIndex);
    });
    previewLabel.textContent = WATERMARK_LABELS[state.previewIndex];
  }

  previewDots.querySelectorAll('.dot').forEach(d => {
    d.addEventListener('click', () => {
      state.previewIndex = parseInt(d.dataset.idx, 10);
      updatePreviewUI();
      drawCard();
    });
  });

  function layoutLines(context, wordObjs, maxWidth) {
    const spaceWidth = context.measureText(' ').width;
    const lines = [];
    let currentLine = [];
    let currentWidth = 0;
    wordObjs.forEach(({ word, idx }) => {
      const w = context.measureText(word).width;
      const addWidth = currentLine.length ? spaceWidth + w : w;
      if (currentWidth + addWidth > maxWidth && currentLine.length) {
        lines.push(currentLine);
        currentLine = [{ word, idx, width: w }];
        currentWidth = w;
      } else {
        currentLine.push({ word, idx, width: w });
        currentWidth += addWidth;
      }
    });
    if (currentLine.length) lines.push(currentLine);
    return lines;
  }

  function renderCard(targetCtx, watermarkText, isMainCanvas) {
    targetCtx.clearRect(0, 0, SIZE_W, SIZE_H);
    const splitY = Math.round(SIZE_H * state.textRatio);
    const ctx = targetCtx;

    // ---- TEXT AREA (top) ----
    ctx.fillStyle = CARD_BG;
    ctx.fillRect(0, 0, SIZE_W, splitY);

    const paddingX = 60;
    const maxWidth = SIZE_W - paddingX * 2;
    ctx.font = `400 ${state.fontSize}px ${FONT_STACK}`;
    ctx.textBaseline = 'middle';

    const paragraphs = (state.text || '').split(/\n/);
    let globalIdx = 0;
    const lines = [];
    paragraphs.forEach(para => {
      const paraWords = para.toUpperCase().split(/\s+/).filter(Boolean);
      if (paraWords.length === 0) {
        lines.push([]); // preserve an intentional blank line
        return;
      }
      const wordObjs = paraWords.map(word => ({ word, idx: globalIdx++ }));
      layoutLines(ctx, wordObjs, maxWidth).forEach(l => lines.push(l));
    });
    const spaceWidth = ctx.measureText(' ').width;
    const lineHeight = state.fontSize * 1.18;
    const totalTextHeight = lines.length * lineHeight;
    const textAreaCenterY = splitY / 2;
    let startY = textAreaCenterY - totalTextHeight / 2 + lineHeight / 2;

    if (isMainCanvas) state.wordBoxes = [];
    ctx.textAlign = 'left';
    lines.forEach((lineWords, i) => {
      const lineWidth = lineWords.reduce((sum, w) => sum + w.width, 0) + spaceWidth * (lineWords.length - 1);
      let x = SIZE_W / 2 - lineWidth / 2;
      const y = startY + i * lineHeight;
      lineWords.forEach(w => {
        ctx.fillStyle = state.redWords.has(w.idx) ? '#E53935' : CARD_TEXT;
        ctx.fillText(w.word, x, y);
        if (isMainCanvas) {
          state.wordBoxes.push({
            idx: w.idx,
            x0: x,
            y0: y - state.fontSize / 2,
            x1: x + w.width,
            y1: y + state.fontSize / 2
          });
        }
        x += w.width + spaceWidth;
      });
    });

    // ---- IMAGE AREA (bottom) ----
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, splitY, SIZE_W, SIZE_H - splitY);

    if (state.image) {
      const img = state.image;
      const targetW = SIZE_W, targetH = SIZE_H - splitY;
      const targetRatio = targetW / targetH;
      const imgRatio = img.width / img.height;

      let baseW, baseH;
      if (imgRatio > targetRatio) { baseH = img.height; baseW = baseH * targetRatio; }
      else { baseW = img.width; baseH = baseW / targetRatio; }

      const cropW = baseW / state.zoom;
      const cropH = baseH / state.zoom;

      state.centerX = Math.max(cropW / 2, Math.min(state.centerX, img.width - cropW / 2));
      state.centerY = Math.max(cropH / 2, Math.min(state.centerY, img.height - cropH / 2));

      const cropX = state.centerX - cropW / 2;
      const cropY = state.centerY - cropH / 2;

      state.cropW = cropW;
      state.cropH = cropH;

      ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, splitY, targetW, targetH);
    }

    // ---- WATERMARK (bottom of image area) — subtle scrim + thin rule + refined label ----
    ctx.save();
    const scrimH = 130;
    const scrimGrad = ctx.createLinearGradient(0, SIZE_H - scrimH, 0, SIZE_H);
    scrimGrad.addColorStop(0, 'rgba(0,0,0,0)');
    scrimGrad.addColorStop(1, 'rgba(0,0,0,0.38)');
    ctx.fillStyle = scrimGrad;
    ctx.fillRect(0, SIZE_H - scrimH, SIZE_W, scrimH);

    // thin center rule above the wordmark
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(SIZE_W / 2 - 22, SIZE_H - 46);
    ctx.lineTo(SIZE_W / 2 + 22, SIZE_H - 46);
    ctx.stroke();

    ctx.font = `600 20px "Poppins", Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.letterSpacing = '5px';
    ctx.fillText(watermarkText, SIZE_W / 2 + 2, SIZE_H - 26);
    ctx.restore();
  }

  // Draws the live, on-screen canvas using whichever watermark variant is
  // currently selected for preview (state.previewIndex), and updates the
  // divider/placeholder UI which only makes sense for the visible canvas.
  function drawCard() {
    const splitY = Math.round(SIZE_H * state.textRatio);
    renderCard(ctx, WATERMARKS[state.previewIndex], true);

    const displayRatio = container.clientHeight / SIZE_H;
    divider.style.top = (splitY * displayRatio) + 'px';
    placeholderHint.style.top = (splitY * displayRatio) + 'px';
    placeholderHint.style.height = ((SIZE_H - splitY) * displayRatio) + 'px';
    placeholderHint.style.display = state.image ? 'none' : 'flex';
  }

  let dragging = false;
  function ratioFromClientY(clientY) {
    const rect = container.getBoundingClientRect();
    let ratio = (clientY - rect.top) / rect.height;
    return Math.max(0.15, Math.min(0.6, ratio));
  }
  divider.addEventListener('pointerdown', (e) => {
    dragging = true;
    divider.setPointerCapture(e.pointerId);
  });
  divider.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    state.textRatio = ratioFromClientY(e.clientY);
    drawCard();
  });
  divider.addEventListener('pointerup', () => { dragging = false; });
  divider.addEventListener('pointercancel', () => { dragging = false; });

  // ---- Move/reposition the image by dragging it (image area is now the BOTTOM part) ----
  // A mostly-horizontal, fairly wide drag is treated as a "swipe" that switches
  // the watermark preview (RELATIONSHIP CUES <-> LINK IN COMMENTS) instead of
  // moving the image; any other drag repositions the image as before.
  let imgDragging = false;
  let lastX = 0, lastY = 0;
  let gestureStartX = 0, gestureStartY = 0;
  let gestureStartCenterX = 0, gestureStartCenterY = 0;
  const SWIPE_MIN_DIST = 55;
  const SWIPE_RATIO = 1.8; // horizontal movement must dominate vertical by this much

  canvas.addEventListener('pointerdown', (e) => {
    if (!state.image) return;
    const rect = container.getBoundingClientRect();
    const splitYDisplay = rect.top + rect.height * state.textRatio;
    if (e.clientY < splitYDisplay) return; // only drag within the image area (bottom), not the text area
    imgDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    gestureStartX = e.clientX;
    gestureStartY = e.clientY;
    gestureStartCenterX = state.centerX;
    gestureStartCenterY = state.centerY;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!imgDragging || !state.image) return;
    const rect = container.getBoundingClientRect();
    const dxDisplay = e.clientX - lastX;
    const dyDisplay = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    const displayImageHeight = rect.height * (1 - state.textRatio);
    const scaleFactorX = state.cropW / rect.width;
    const scaleFactorY = state.cropH / displayImageHeight;

    state.centerX -= dxDisplay * scaleFactorX;
    state.centerY -= dyDisplay * scaleFactorY;

    drawCard();
  });

  // ---- Tap a word in the TEXT area to toggle it red ----
  canvas.addEventListener('click', (e) => {
    if (!state.text) return;
    const rect = container.getBoundingClientRect();
    const splitYDisplay = rect.top + rect.height * state.textRatio;
    if (e.clientY >= splitYDisplay) return; // only handle taps inside the text area (top)

    const canvasX = (e.clientX - rect.left) / rect.width * SIZE_W;
    const canvasY = (e.clientY - rect.top) / rect.height * SIZE_H;

    const hit = state.wordBoxes.find(b =>
      canvasX >= b.x0 && canvasX <= b.x1 && canvasY >= b.y0 && canvasY <= b.y1
    );
    if (!hit) return;

    if (state.redWords.has(hit.idx)) state.redWords.delete(hit.idx);
    else state.redWords.add(hit.idx);
    drawCard();
  });

  canvas.addEventListener('pointerup', (e) => {
    if (imgDragging && state.image) {
      const totalDX = e.clientX - gestureStartX;
      const totalDY = e.clientY - gestureStartY;
      if (Math.abs(totalDX) >= SWIPE_MIN_DIST && Math.abs(totalDX) >= Math.abs(totalDY) * SWIPE_RATIO) {
        // it was a swipe, not a reposition drag: undo any image shift and flip the preview
        state.centerX = gestureStartCenterX;
        state.centerY = gestureStartCenterY;
        state.previewIndex = totalDX < 0
          ? Math.min(1, state.previewIndex + 1)
          : Math.max(0, state.previewIndex - 1);
        updatePreviewUI();
      }
    }
    imgDragging = false;
    drawCard();
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointercancel', () => { imgDragging = false; });

  document.getElementById('pickImageBtn').addEventListener('click', () => {
    fileInput.click();
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        state.image = img;
        state.zoom = 1;
        state.centerX = img.width / 2;
        state.centerY = img.height / 2;
        zoomInput.value = 100;
        zoomVal.textContent = 100;
        drawCard();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  factText.addEventListener('input', () => {
    state.text = factText.value;
    state.redWords.clear();
    drawCard();
  });
  fontSizeInput.addEventListener('input', () => {
    state.fontSize = parseInt(fontSizeInput.value, 10);
    fontSizeVal.textContent = state.fontSize;
    drawCard();
  });
  zoomInput.addEventListener('input', () => {
    state.zoom = parseInt(zoomInput.value, 10) / 100;
    zoomVal.textContent = zoomInput.value;
    drawCard();
  });

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function exportVariant(watermarkText) {
    return new Promise((resolve) => {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = SIZE_W;
      offCanvas.height = SIZE_H;
      const offCtx = offCanvas.getContext('2d');
      renderCard(offCtx, watermarkText, false); // false = don't touch the visible canvas's hit-test boxes
      offCanvas.toBlob((blob) => resolve(blob), 'image/png');
    });
  }

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const ts = Date.now();
    const fileNames = ['RelationshipCues_' + ts + '.png', 'LinkInComments_' + ts + '.png'];
    for (let i = 0; i < WATERMARKS.length; i++) {
      const blob = await exportVariant(WATERMARKS[i]);
      downloadBlob(blob, fileNames[i]);
      // small delay between downloads so browsers don't drop/merge the second one
      if (i < WATERMARKS.length - 1) await new Promise(r => setTimeout(r, 350));
    }
    // restore the visible canvas exactly as the user had it (hit-test boxes etc.)
    drawCard();
  });

  window.addEventListener('resize', drawCard);
  window.addEventListener('load', drawCard);
  updatePreviewUI();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawCard);
  }
  drawCard();
</script>
</body>
</html>
